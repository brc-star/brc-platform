apiVersion: apps/v1
kind: Deployment
metadata:
  name: brcstar-enterprise-web
  namespace: production
  labels:
    app.kubernetes.io/name: brcstar-enterprise
    app.kubernetes.io/component: web-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: brcstar-enterprise-web
  template:
    metadata:
      labels:
        app: brcstar-enterprise-web
    spec:
      containers:
        - name: web
          image: registry.brcstar.in/enterprise/platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: brcstar-config
            - secretRef:
                name: brcstar-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
