apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brcstar-enterprise-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - brcstar.in
        - www.brcstar.in
        - app.brcstar.in
        - investor.brcstar.in
        - partner.brcstar.in
        - crm.brcstar.in
        - erp.brcstar.in
      secretName: brcstar-tls-cert
  rules:
    - host: brcstar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brcstar-enterprise-service
                port:
                  number: 80
    - host: www.brcstar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brcstar-enterprise-service
                port:
                  number: 80
    - host: app.brcstar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brcstar-enterprise-service
                port:
                  number: 80
    - host: investor.brcstar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brcstar-enterprise-service
                port:
                  number: 80
    - host: partner.brcstar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brcstar-enterprise-service
                port:
                  number: 80
