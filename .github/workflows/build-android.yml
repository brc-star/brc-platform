name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'aab'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Package Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock?schema=public"

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Android Release App Bundle (AAB for Play Store)
        if: github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BRC-STAR-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Bundle Artifact (Google Play)
        if: github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BRC-STAR-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
